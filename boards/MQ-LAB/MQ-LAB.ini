; MQ-LAB 2.4" ESP32 touchscreen target
; Reuses the Bruce CYD-2432S028 hardware implementation because the
; LCD, resistive touch and SD wiring match this board.

[env:MQ-LAB]
extends = CYD_base

build_flags =
    ${CYD_base.build_flags}

    ; Display / backlight
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

    ; Resistive touch
    -DTOUCH_CS=33
    -DCYD28_TouchR_CAL_XMIN=480
    -DCYD28_TouchR_CAL_XMAX=3580
    -DCYD28_TouchR_CAL_YMIN=350
    -DCYD28_TouchR_CAL_YMAX=3760

    -DDEVICE_NAME='"MQ-LAB"'
